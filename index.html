<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanaristi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <div class="titleRow">
            <div id="dateInfo"></div>
            <h1>SANARISTI</h1>
            <button id="helpButton" aria-label="Ohje">?</button>
        </div>

        <div id="helpOverlay">
            <div id="helpSection">
                <button id="closeHelpButton" aria-label="Sulje ohje">×</button>

                <h2>Ohje</h2>

                <p>Ohjeteksti lisätään myöhemmin!</p>
            </div>
        </div>

        <div id="puzzle"></div>


        <button id="checkButton">
            TARKISTA
        </button>

        <button id="hintButton">
            Vihje
        </button>


        <div id="message"></div>

    </main>

    <script src="game.js"></script>

</body>
</html>
